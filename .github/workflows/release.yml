name: Build signed release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag and draft release, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    name: Sign, notarize, and attach installer
    runs-on: macos-latest
    environment: release
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Release tag must look like v0.1.0"; exit 1 ;;
          esac

          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")" \
            || { echo "::error::Checkout does not match $RELEASE_TAG"; exit 1; }

          is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
          test "$is_draft" = true \
            || { echo "::error::$RELEASE_TAG must already exist as a draft release"; exit 1; }

      - name: Check project and release-script sources
        run: |
          ./scripts/check-project-sources.sh
          zsh -n ./scripts/package-release.sh

      - name: Test release tag
        run: |
          xcodebuild \
            -quiet \
            -project "Jiukong Zhuyin.xcodeproj" \
            -scheme "Jiukong Zhuyin" \
            -configuration Debug \
            -destination "platform=macOS,arch=$(uname -m)" \
            -derivedDataPath .build/ReleaseTests \
            CODE_SIGN_ENTITLEMENTS= \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            test

      - name: Reproduce release dictionary
        run: |
          ./scripts/build-dictionary.sh
          git diff --exit-code -- Resources/Dictionary/JiukongZhuyin.sqlite3 \
            || { echo "::error::Runtime dictionary is not reproducible"; exit 1; }

      - name: Import Developer ID identities and provisioning profile
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.DEVELOPER_ID_PROVISIONING_PROFILE_BASE64 }}
        run: |
          for required_name in \
            CERTIFICATE_P12_BASE64 \
            CERTIFICATE_PASSWORD \
            PROVISIONING_PROFILE_BASE64; do
            test -n "${!required_name}" \
              || { echo "::error::Missing release environment secret: $required_name"; exit 1; }
          done

          signing_directory="$RUNNER_TEMP/jiukong-signing"
          signing_keychain="$signing_directory/release.keychain-db"
          certificate_path="$signing_directory/developer-id.p12"
          profile_path="$signing_directory/JiukongZhuyin.provisionprofile"
          profile_plist="$signing_directory/profile.plist"
          keychain_password="$(uuidgen)$(uuidgen)"
          mkdir -p "$signing_directory"

          printf '%s' "$CERTIFICATE_P12_BASE64" | /usr/bin/base64 -D > "$certificate_path"
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | /usr/bin/base64 -D > "$profile_path"

          security create-keychain -p "$keychain_password" "$signing_keychain"
          security set-keychain-settings -lut 21600 "$signing_keychain"
          security unlock-keychain -p "$keychain_password" "$signing_keychain"
          security import "$certificate_path" \
            -k "$signing_keychain" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$signing_keychain"
          security list-keychains -d user -s "$signing_keychain"

          application_identity="$(
            security find-identity -v "$signing_keychain" \
              | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' \
              | head -n 1
          )"
          installer_identity="$(
            security find-identity -v "$signing_keychain" \
              | sed -n 's/.*"\(Developer ID Installer:[^"]*\)".*/\1/p' \
              | head -n 1
          )"
          test -n "$application_identity" \
            || { echo "::error::P12 has no Developer ID Application identity"; exit 1; }
          test -n "$installer_identity" \
            || { echo "::error::P12 has no Developer ID Installer identity"; exit 1; }

          security cms -D -i "$profile_path" -o "$profile_plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
          development_team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist")"
          application_prefix="$(/usr/libexec/PlistBuddy -c 'Print :ApplicationIdentifierPrefix:0' "$profile_plist")"
          application_identifier="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :Entitlements:com.apple.application-identifier' \
              "$profile_plist"
          )"
          icloud_container="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :Entitlements:com.apple.developer.icloud-container-identifiers:0' \
              "$profile_plist"
          )"
          icloud_services="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :Entitlements:com.apple.developer.icloud-services' \
              "$profile_plist"
          )"
          icloud_environment="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :Entitlements:com.apple.developer.icloud-container-environment' \
              "$profile_plist"
          )"
          provisions_all_devices="$(
            /usr/libexec/PlistBuddy -c 'Print :ProvisionsAllDevices' "$profile_plist"
          )"
          test "$application_identifier" = "$application_prefix.tw.idv.jiukong.inputmethod.zhuyin" \
            || { echo "::error::Provisioning profile belongs to the wrong App ID"; exit 1; }
          test "$icloud_container" = "iCloud.tw.idv.jiukong.inputmethod.zhuyin" \
            || { echo "::error::Provisioning profile has the wrong iCloud container"; exit 1; }
          test "$icloud_services" = '*' || [[ "$icloud_services" = *CloudKit* ]] \
            || { echo "::error::Provisioning profile does not authorize CloudKit"; exit 1; }
          test "$icloud_environment" = Production \
            || { echo "::error::Provisioning profile does not select Production CloudKit"; exit 1; }
          test "$provisions_all_devices" = true \
            || { echo "::error::Provisioning profile is not a Developer ID all-devices profile"; exit 1; }

          profiles_directory="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profiles_directory"
          cp "$profile_path" "$profiles_directory/$profile_uuid.provisionprofile"

          echo "::add-mask::$keychain_password"
          echo "SIGNING_KEYCHAIN=$signing_keychain" >> "$GITHUB_ENV"
          echo "DEVELOPER_ID_APPLICATION=$application_identity" >> "$GITHUB_ENV"
          echo "DEVELOPER_ID_INSTALLER=$installer_identity" >> "$GITHUB_ENV"
          echo "DEVELOPMENT_TEAM=$development_team" >> "$GITHUB_ENV"
          echo "DEVELOPER_ID_PROVISIONING_PROFILE=$profile_name" >> "$GITHUB_ENV"
          echo "INSTALLED_PROVISIONING_PROFILE=$profiles_directory/$profile_uuid.provisionprofile" >> "$GITHUB_ENV"

      - name: Install notary API key
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID_SECRET: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID_SECRET: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          for required_name in \
            NOTARY_KEY_P8_BASE64 \
            NOTARY_KEY_ID_SECRET \
            NOTARY_ISSUER_ID_SECRET; do
            test -n "${!required_name}" \
              || { echo "::error::Missing release environment secret: $required_name"; exit 1; }
          done

          notary_key_file="$RUNNER_TEMP/jiukong-signing/AuthKey_$NOTARY_KEY_ID_SECRET.p8"
          printf '%s' "$NOTARY_KEY_P8_BASE64" | /usr/bin/base64 -D > "$notary_key_file"
          chmod 600 "$notary_key_file"
          echo "NOTARY_KEY_FILE=$notary_key_file" >> "$GITHUB_ENV"
          echo "NOTARY_KEY_ID=$NOTARY_KEY_ID_SECRET" >> "$GITHUB_ENV"
          echo "NOTARY_ISSUER_ID=$NOTARY_ISSUER_ID_SECRET" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and verify installer
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: ./scripts/package-release.sh

      - name: Attach installer to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          release_version="${RELEASE_TAG#v}"
          package="dist/Jiukong-Zhuyin-$release_version.pkg"
          gh release upload "$RELEASE_TAG" "$package" "$package.sha256" --clobber

      - name: Remove temporary signing material
        if: always()
        run: |
          if test -n "${SIGNING_KEYCHAIN:-}" && test -f "$SIGNING_KEYCHAIN"; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
          if test -n "${INSTALLED_PROVISIONING_PROFILE:-}"; then
            rm -f "$INSTALLED_PROVISIONING_PROFILE"
          fi
